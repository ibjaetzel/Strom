<style>body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif}:root{--bg:#f6f6f3;--card:#fff;--text:#20201e;--muted:#6c6c66;--line:#d3d3ce;--solar:#efa020;--grid:#3b82c4;--batt:#4f9a5b;--wall:#8b5cf6;--warn:#d5803b}#eflow{background:var(--bg);border-radius:12px;padding:12px;color:var(--text)}#wrap{display:flex;gap:16px}.stage{position:relative;width:760px;height:500px;flex:1}.node{position:absolute;transform:translate(-50%,-50%);border:3px solid #ddd;background:var(--card);border-radius:50%;width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.small{width:80px;height:80px}.big{width:118px;height:118px}.label{position:absolute;top:100%;margin-top:6px;color:var(--muted);white-space:nowrap}.val{font-weight:700}.sub{font-size:12px;color:var(--muted)}svg{position:absolute;inset:0}.line{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round}.side{width:310px}.card{background:var(--card);border:1px solid #e6e6e1;border-radius:12px;padding:12px;margin-bottom:10px}.h{font-weight:700;margin-bottom:8px}.btn{width:100%;display:block;margin:6px 0;padding:8px;border-radius:8px;border:1px solid #ddd;background:var(--bg);text-align:left}.on{border-color:var(--wall);background:#efe8ff;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;margin:8px 0;font-size:13px}.row span{color:var(--muted)}input{width:72px} .ok{color:var(--batt)}.warn{color:var(--warn)}</style><div id="eflow"><div id="wrap"><div class="stage"><svg viewBox="0 0 760 500"><path class="line" d="M210 110 C230 170 285 210 340 235"/><path class="line" d="M390 110 C370 170 355 205 340 235"/><path class="line" d="M130 380 C220 360 260 305 310 285"/><path class="line" d="M340 310 L340 380 L500 380"/><path class="line" d="M400 260 L575 260"/></svg><div class="node small" style="left:210px;top:70px;border-color:var(--solar)"><div class="val" id="pvS">0 W</div><div class="label">PV Süd</div></div><div class="node small" style="left:390px;top:70px;border-color:var(--solar)"><div class="val" id="pvW">0 W</div><div class="label">PV West</div></div><div class="node big" style="left:340px;top:260px;border-color:var(--solar)"><div class="val" id="house">0 W</div><div class="label">Haus / Bus</div></div><div class="node small" style="left:90px;top:390px;border-color:var(--grid)"><div class="val" id="grid">0 W</div><div class="label">Netz</div></div><div class="node small" style="left:340px;top:410px;border-color:var(--batt)"><div class="val" id="inv">0 W</div><div class="sub" id="invsub"></div><div class="label">Batterie-WR</div></div><div class="node" style="left:555px;top:410px;border-color:var(--batt)"><div class="val" id="soc">0 %</div><div class="label">Hausbatterie</div></div><div class="node small" style="left:625px;top:260px;border-color:var(--wall)"><div class="val" id="wallp">0 W</div><div class="label">Wallbox</div></div></div><div class="side"><div class="card"><div class="h">Wallbox</div><button id="wm0" class="btn" onclick="setWallboxMode(0)">Kein Laden</button><button id="wm1" class="btn" onclick="setWallboxMode(1)">Laden aus dem Netz</button><button id="wm2" class="btn" onclick="setWallboxMode(2)">Laden mit PV-Überschuss</button><div class="row"><span>ab Hausbatterie</span><b><input id="wallSoc" type="number" onchange="setWallboxSoc()"> %</b></div><div id="wallStatus"></div></div><div class="card"><div class="h">Hausbatterie-Netzladung</div><button id="hg0" class="btn" onclick="setHomeGrid(false)">Kein Laden aus dem Netz</button><button id="hg1" class="btn" onclick="setHomeGrid(true)">Netzladen nach Zeitplan</button><div class="row"><span>Fenster 1</span><b><input id="w1s" type="time" onchange="setWindow(1)"> <input id="w1e" type="time" onchange="setWindow(1)"> <input id="w1soc" type="number" onchange="setWindow(1)">%</b></div><div class="row"><span>Fenster 2</span><b><input id="w2s" type="time" onchange="setWindow(2)"> <input id="w2e" type="time" onchange="setWindow(2)"> <input id="w2soc" type="number" onchange="setWindow(2)">%</b></div><div id="homeStatus"></div></div></div></div></div><script>function fmt(v){return Math.round(v||0).toLocaleString('de-DE')+' W'}let cur={};function setState(d){cur=d||{};let ps=+d.pvSouth||0,pw=+d.pvWest||0,l1=+d.l1||0,l2=+d.l2||0,l3=+d.l3||0,g=('grid'in d)?+d.grid:l1+l2+l3,bp=+d.batteryPower||0,bs=+d.batterySoc||0,w=d.wallbox||{},hp=d.homeBattery||{},wins=hp.windows||[{start:'00:00',end:'06:00',targetSoc:60},{start:'13:00',end:'15:00',targetSoc:80}],wm=+w.mode||0,ws=+w.socMin||80,wp=+w.power||0;pvS.textContent=fmt(ps);pvW.textContent=fmt(pw);grid.textContent=(g>=0?'← ':'→ ')+fmt(Math.abs(g));inv.textContent=fmt(Math.abs(bp));invsub.textContent=bp>=0?'Entladen':'Laden';soc.textContent=Math.round(bs)+' %';wallp.textContent=fmt(wp);house.textContent=fmt(Math.max(0,ps+pw+Math.max(g,0)+Math.max(bp,0)-wp-Math.max(-g,0)-Math.max(-bp,0)));[0,1,2].forEach(i=>document.getElementById('wm'+i).classList.toggle('on',wm===i));wallSoc.value=ws;let ok=wm===1||(wm===2&&bs>ws&&g<0);wallStatus.innerHTML=wm===0?'Status: gesperrt':wm===1?'Status: <b class=ok>Netzladen erlaubt</b>':`Status: <b class=${ok?'ok':'warn'}>${ok?'PV-Überschuss frei':'wartet auf SOC/Überschuss'}</b>`;hg0.classList.toggle('on',!hp.gridChargeEnabled);hg1.classList.toggle('on',!!hp.gridChargeEnabled);[0,1].forEach(i=>{document.getElementById('w'+(i+1)+'s').value=wins[i].start||'';document.getElementById('w'+(i+1)+'e').value=wins[i].end||'';document.getElementById('w'+(i+1)+'soc').value=wins[i].targetSoc||''});homeStatus.textContent=hp.gridChargeEnabled?'Zeitplan aktiv':'Kein Netzladen'}function handleMessage(x){setState(typeof x==='string'?JSON.parse(x):x)}function req(a,v){try{requestAction(a,v)}catch(e){}}function setWallboxMode(v){req('WallboxMode',v);cur.wallbox=cur.wallbox||{};cur.wallbox.mode=v;setState(cur)}function setWallboxSoc(){req('WallboxSocMin',+wallSoc.value)}function setHomeGrid(v){req('HomeGridChargeEnabled',v);cur.homeBattery=cur.homeBattery||{};cur.homeBattery.gridChargeEnabled=v;setState(cur)}function setWindow(n){req('HomeWindow'+n,{start:document.getElementById('w'+n+'s').value,end:document.getElementById('w'+n+'e').value,targetSoc:+document.getElementById('w'+n+'soc').value})}setState({pvSouth:2400,pvWest:1300,l1:100,l2:100,l3:-700,batteryPower:-500,batterySoc:76,wallbox:{power:0,mode:2,socMin:80},homeBattery:{gridChargeEnabled:true,windows:[{start:'00:00',end:'06:00',targetSoc:60},{start:'13:00',end:'15:00',targetSoc:80}]}})</script>
